# 单机模拟三端（dev / test / 单机联调，09 §14 / D15）。
#
# 三个 service：operation（:8001）manager（:8002）agent（:8003）+ PostgreSQL/pgvector（主机端口取 ENV 的 POSTGRES_PORT，缺省 5433 对齐 SOP）。
# 每个 service 用各自 Dockerfile.<tier> 构建——产物在镜像层即按端精简，互不含对方后端/前端。
#
# 红线（D15）：agent 服务镜像构建上下文虽是整个仓库，但 Dockerfile.agent 的 COPY 严格限定，
# 镜像内绝不出现 operation_service/manager_service/web/operation/web/manager（由
# server/tests/integration/test_verification_matrix.py::test_user_client_build_excludes_control_plane
# 静态断言 Dockerfile COPY 指令钉死）。
# This Compose graph is dev/test-only for control-plane services. Production
# control planes use the local/systemd topology (or a separately TLS-wrapped
# deployment); the guards below reject direct production control-plane startup.

services:
  # Every service depends on this short-lived gate. A direct production
  # `docker compose up` has no ctl authorization and therefore fails before
  # any control-plane, relay, or LightRAG writer starts.
  aiteam-compose-guard:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: aiteam-compose-guard
    environment:
      AITEAM_ENV: ${AITEAM_ENV:?AITEAM_ENV must be explicitly set}
    entrypoint: ["sh", "-ec"]
    command: ["case \"$${AITEAM_ENV}\" in production) echo 'production control-plane Compose is unsupported; use the local/systemd or dedicated maintenance topology' >&2; exit 1 ;; dev|development|test) ;; *) echo 'AITEAM_ENV must be dev, development, test, or production' >&2; exit 1 ;; esac"]

  postgres:
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: aiteam-pg
    environment:
      # The superuser/password are deployment inputs. Defaults are dev-only;
      # ctl.sh requires non-placeholder values for production starts.
      POSTGRES_USER: ${POSTGRES_SUPER_USER:-aiteam}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-aiteam_test}
      POSTGRES_DB: ${MANAGER_DB_NAME:-${POSTGRES_DB:-manager_control_db}}
      POSTGRES_OPERATION_DB: ${OPERATION_DB_NAME:-oper}
    networks: [control-plane-db]
    ports:
      # Keep the control-plane database on host loopback; app containers use
      # the private Compose network and never need a public database bind.
      # 主机端口统一由 ENV 的 POSTGRES_PORT 决定（与 ctl.sh 拼 DB_URL 用的同一来源，
      # 避免「app 连 5434 / 容器开 5433」错配）；未注入时回退 5433（对齐 SOP 缺省）。
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./init-postgres-databases.sh:/docker-entrypoint-initdb.d/20-aiteam-operation-db.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional Manager-side LightRAG stack. It is not part of the default three-tier
  # dev/test startup; enable explicitly with --profile lightrag after bootstrap.
  # The database is separate from the AI Team control-plane database and is never
  # attached to the Agent network/API surface.
  lightrag-postgres:
    profiles: [lightrag]
    image: ${LIGHTRAG_PG_IMAGE:-pgvector/pgvector:pg16}
    container_name: aiteam-lightrag-pg
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${LIGHTRAG_DB_ADMIN_USER:-lightrag_admin}
      POSTGRES_PASSWORD: ${LIGHTRAG_DB_ADMIN_PASSWORD:-}
      POSTGRES_DB: ${LIGHTRAG_DB_NAME:-lightrag}
    ports:
      - "127.0.0.1:${LIGHTRAG_PG_PORT:-55432}:5432"
    volumes:
      - lightrag_pgdata:/var/lib/postgresql/data
    networks: [lightrag-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  lightrag:
    profiles: [lightrag]
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag:1.5.6}
    container_name: aiteam-lightrag
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
      lightrag-postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      # These are Manager-side only; do not copy them into the Agent service.
      API_KEY: ${LIGHTRAG_API_KEY:-}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      # LightRAG native UI/API account authentication; required whenever this
      # local profile is enabled in production. Remote pool-only Manager mode
      # must not enable the lightrag profile.
      AUTH_ACCOUNTS: ${LIGHTRAG_AUTH_ACCOUNTS:-}
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET:-}
      JWT_ALGORITHM: ${LIGHTRAG_JWT_ALGORITHM:-HS256}
      POSTGRES_HOST: lightrag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${LIGHTRAG_DB_USER:-lightrag}
      POSTGRES_PASSWORD: ${LIGHTRAG_DB_PASSWORD:-}
      POSTGRES_DATABASE: ${LIGHTRAG_DB_NAME:-lightrag}
      # Workspace is selected per request by Manager's LIGHTRAG-WORKSPACE header;
      # do not set a process-global POSTGRES_WORKSPACE here.
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      LIGHTRAG_GRAPH_STORAGE: PGTableGraphStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      EMBEDDING_DIM: ${LIGHTRAG_EMBEDDING_DIM:-1024}
      LOG_LEVEL: ${LIGHTRAG_LOG_LEVEL:-INFO}
    networks: [lightrag-internal]
    ports:
      # Native LightRAG UI/API link target; keep loopback by default and open it
      # only on a protected Manager host when direct browser access is required.
      - "127.0.0.1:${LIGHTRAG_PORT:-9621}:9621"
    expose:
      - "9621"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9621/health\", timeout=2)' "]
      interval: 10s
      timeout: 5s
      retries: 12

  # Platform-managed AI Relay. It is a first-class AI Team component; its
  # PostgreSQL/Redis and all management/upstream credentials stay private. The
  # UI/API host binding remains loopback by default; set *_BIND_HOST behind a
  # firewall/TLS boundary when the native UI is opened from a browser.
  newapi-postgres:
    profiles: [newapi]
    image: ${NEWAPI_POSTGRES_IMAGE:-postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229}
    container_name: aiteam-newapi-pg
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${NEWAPI_DB_USER:-newapi}
      POSTGRES_PASSWORD: ${NEWAPI_DB_PASSWORD:-}
      POSTGRES_DB: ${NEWAPI_DB_NAME:-newapi}
    volumes:
      - newapi_pgdata:/var/lib/postgresql/data
    networks: [newapi-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  newapi-redis:
    profiles: [newapi]
    image: ${NEWAPI_REDIS_IMAGE:-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf}
    container_name: aiteam-newapi-redis
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
    environment:
      REDIS_PASSWORD: ${NEWAPI_REDIS_PASSWORD:-}
    # Materialize a mode-600 config inside the isolated container, then drop
    # the env copy before redis-server exec so the password is neither argv nor
    # the long-running Redis process environment.
    command: ["sh", "-c", "umask 077; printf 'requirepass %s\\n' \"$${REDIS_PASSWORD}\" > /tmp/redis.conf; unset REDIS_PASSWORD; exec redis-server /tmp/redis.conf"]
    volumes:
      - newapi_redisdata:/data
    networks: [newapi-internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  newapi:
    profiles: [newapi]
    image: ${NEWAPI_IMAGE:-calciumion/new-api:v1.0.0-rc.25@sha256:54a0b10924aa75fa5b5947208b820ced66b6ef4b445b35f122b31d80676aba2b}
    container_name: aiteam-newapi
    restart: unless-stopped
    command: --log-dir /app/logs
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
      newapi-postgres:
        condition: service_healthy
      newapi-redis:
        condition: service_healthy
    ports:
      # Native NewAPI UI link target; keep loopback by default and open it only
      # behind the Operator host firewall/TLS boundary when direct access is required.
      - "127.0.0.1:${NEWAPI_PORT:-9300}:3000"
    environment:
      SQL_DSN: postgresql://${NEWAPI_DB_USER:-newapi}:${NEWAPI_DB_PASSWORD:-}@newapi-postgres:5432/${NEWAPI_DB_NAME:-newapi}
      REDIS_CONN_STRING: redis://:${NEWAPI_REDIS_PASSWORD:-}@newapi-redis:6379
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET:-}
      CRYPTO_SECRET: ${NEWAPI_CRYPTO_SECRET:-}
      TZ: ${NEWAPI_TZ:-UTC}
      ERROR_LOG_ENABLED: "false"
      BATCH_UPDATE_ENABLED: "false"
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_PROXIES: none
      NODE_NAME: aiteam-newapi
    volumes:
      - newapi_data:/data
      - newapi_logs:/app/logs
    networks: [operation-newapi]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  operation:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.operation
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ${AITEAM_OPERATION_IMAGE:-aiteam-operation:0.1.0}
    container_name: aiteam-operation
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      # Control-plane HTTP is host-loopback only; put a TLS reverse proxy in
      # front when remote browser access is required.
      - "127.0.0.1:8001:8000"
    environment:
      APP_TIER: operation
      AITEAM_ENV: ${AITEAM_ENV:?AITEAM_ENV must be explicitly set}
      MANAGER_DB_NAME: ${MANAGER_DB_NAME:-${POSTGRES_DB:-manager_control_db}}
      OPERATION_DB_NAME: ${OPERATION_DB_NAME:-oper}
      AITEAM_COMPOSE_MODE: "1"
      # Operation business repositories use the constrained app_rw role;
      # ADMIN_DB_URL is reserved for migrations/signing-key administration.
      OPERATION_DB_URL: postgresql://app_rw:${APP_RW_PASSWORD:-${POSTGRES_PASSWORD:-app_rw_dev}}@postgres:5432/${OPERATION_DB_NAME:-oper}
      OPERATION_ADMIN_DB_URL: postgresql://${POSTGRES_SUPER_USER:-aiteam}:${POSTGRES_SUPER_PASSWORD:-aiteam_test}@postgres:5432/${OPERATION_DB_NAME:-oper}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-${POSTGRES_PASSWORD:-app_rw_dev}}
      # 云侧服务间调用：运营端调企业端开通 tenant。
      MANAGER_URL: http://manager:8000
      # Operator-only internal NewAPI management surface. Never copy admin credentials to Manager/Agent.
      # NEWAPI_URL is the environment-level base address, like HINDSIGHT_URL/LIGHTRAG_URL.
      NEWAPI_URL: ${NEWAPI_URL:-http://newapi:3000}
      NEWAPI_ADMIN_BASE_URL: ${NEWAPI_ADMIN_BASE_URL:-${NEWAPI_URL:-http://newapi:3000}}
      # Must be the externally reachable HTTPS/host URL used by Manager/Agent;
      # never fall back to the private Docker service name.
      NEWAPI_PUBLIC_BASE_URL: ${NEWAPI_PUBLIC_BASE_URL:-}
      MODEL_PRICING_URL: ${MODEL_PRICING_URL:-https://models.dev/api.json}
      NEWAPI_ADMIN_USER_ID: ${NEWAPI_ADMIN_USER_ID:-}
      NEWAPI_ADMIN_TOKEN: ${NEWAPI_ADMIN_TOKEN:-}
      OPERATION_PROVIDER_CREDENTIAL_KEY: ${OPERATION_PROVIDER_CREDENTIAL_KEY:-}
      OPERATION_SYSTEM_USERNAME: ${OPERATION_SYSTEM_USERNAME:-}
      OPERATION_SYSTEM_PASSWORD: ${OPERATION_SYSTEM_PASSWORD:-}
      # 服务间认证共享密钥（平面③，03 §9.1）。dev 用占位值；生产应替换为 openssl rand -hex 32 生成的强密钥。
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-placeholder}
      SERVICE_CLIENT_TIMEOUT_MS: ${SERVICE_CLIENT_TIMEOUT_MS:-30000}
      LOG_LEVEL: INFO
      EXPOSE_PUBLIC_DOCS: ${EXPOSE_PUBLIC_DOCS:-1}
    networks: [control-plane, control-plane-db, operation-newapi]

  manager:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.manager
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ${AITEAM_MANAGER_IMAGE:-aiteam-manager:0.1.0}
    container_name: aiteam-manager
    volumes:
      - managerdata:/app/data
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      # Control-plane HTTP is host-loopback only; put a TLS reverse proxy in
      # front when remote browser access is required.
      - "127.0.0.1:8002:8000"
    networks:
      - control-plane
      - control-plane-db
      - lightrag-internal
    environment:
      APP_TIER: manager
      AITEAM_COMPOSE_MODE: "1"
      MANAGER_DB_NAME: ${MANAGER_DB_NAME:-${POSTGRES_DB:-manager_control_db}}
      OPERATION_DB_NAME: ${OPERATION_DB_NAME:-oper}
      # 业务连接（受约束 app_rw 角色 + RLS）。
      DB_URL: postgresql://app_rw:${APP_RW_PASSWORD:-${POSTGRES_PASSWORD:-app_rw_dev}}@postgres:5432/${MANAGER_DB_NAME:-${POSTGRES_DB:-manager_control_db}}
      # Manager 知识源持久化根（bundle exporter 读取此卷，不上传会话内容）。
      AITEAM_MANAGER_DATA_ROOT: /app/data
      # 迁移走管理连接（超管/DDL owner，#60）。
      ADMIN_DB_URL: postgresql://${POSTGRES_SUPER_USER:-aiteam}:${POSTGRES_SUPER_PASSWORD:-aiteam_test}@postgres:5432/${MANAGER_DB_NAME:-${POSTGRES_DB:-manager_control_db}}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-${POSTGRES_PASSWORD:-app_rw_dev}}
      # Legacy compatibility input; Manager ignores it and resolves tenant from
      # the authenticated session/JWT, never from tenant_registry first-row order.
      MANAGER_TENANT_ID: ${MANAGER_TENANT_ID:-}
      MANAGER_CREDENTIAL_KEY: ${MANAGER_CREDENTIAL_KEY:-}
      HINDSIGHT_URL: ${HINDSIGHT_URL:-}
      HINDSIGHT_SERVICE_TOKEN: ${HINDSIGHT_SERVICE_TOKEN:-}
      HINDSIGHT_RECALL_PATH: ${HINDSIGHT_RECALL_PATH:-}
      HINDSIGHT_RETAIN_PATH: ${HINDSIGHT_RETAIN_PATH:-}
      HINDSIGHT_DELETE_PATH: ${HINDSIGHT_DELETE_PATH:-}
      HINDSIGHT_UPDATE_PATH: ${HINDSIGHT_UPDATE_PATH:-}
      HINDSIGHT_LIST_PATH: ${HINDSIGHT_LIST_PATH:-}
      HINDSIGHT_STATS_PATH: ${HINDSIGHT_STATS_PATH:-}
      HINDSIGHT_FACADE_URL: ${HINDSIGHT_FACADE_URL:-/api/manager/hindsight}
      HINDSIGHT_LEASE_TTL_SECONDS: ${HINDSIGHT_LEASE_TTL_SECONDS:-300}
      OPERATOR_URL: http://operation:8000
      # Manager-only LightRAG credentials; never copied to the Agent container.
      # The LightRAG service is opt-in (profile lightrag); configure an
      # explicitly reachable Manager-side URL or leave unset (fail closed).
      LIGHTRAG_URL: ${LIGHTRAG_URL:-}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      LIGHTRAG_INSTANCES: ${LIGHTRAG_INSTANCES:-}
      LIGHTRAG_TIMEOUT_MS: ${LIGHTRAG_TIMEOUT_MS:-5000}
      LIGHTRAG_PIPELINE_TIMEOUT_MS: ${LIGHTRAG_PIPELINE_TIMEOUT_MS:-300000}
      LIGHTRAG_POLL_INTERVAL_MS: ${LIGHTRAG_POLL_INTERVAL_MS:-250}
      LIGHTRAG_QUERY_MODE: ${LIGHTRAG_QUERY_MODE:-naive}
      # 服务间认证共享密钥（平面③，03 §9.1）。dev 用占位值；生产应替换为 openssl rand -hex 32 生成的强密钥。
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-placeholder}
      SERVICE_CLIENT_TIMEOUT_MS: ${SERVICE_CLIENT_TIMEOUT_MS:-30000}
      AITEAM_ENV: ${AITEAM_ENV:?AITEAM_ENV must be explicitly set}
      AITEAM_JWT_ISSUER: ${AITEAM_JWT_ISSUER:-aiteam-manager}
      AITEAM_JWT_AUDIENCE: ${AITEAM_JWT_AUDIENCE:-aiteam-agent}
      # Manager-only signing secrets. Agent receives public metadata through the pull contract.
      AITEAM_SKILL_SIGNING_PRIVATE_KEY: ${AITEAM_SKILL_SIGNING_PRIVATE_KEY:-}
      AITEAM_SKILL_SIGNING_CURRENT_PRIVATE_KEY: ${AITEAM_SKILL_SIGNING_CURRENT_PRIVATE_KEY:-}
      AITEAM_SKILL_SIGNING_CURRENT_KEY_ID: ${AITEAM_SKILL_SIGNING_CURRENT_KEY_ID:-}
      AITEAM_SKILL_SIGNING_KEY_ID: ${AITEAM_SKILL_SIGNING_KEY_ID:-skills-dev-current}
      AITEAM_SKILL_SIGNING_NEXT_PRIVATE_KEY: ${AITEAM_SKILL_SIGNING_NEXT_PRIVATE_KEY:-}
      AITEAM_SKILL_SIGNING_NEXT_KEY_ID: ${AITEAM_SKILL_SIGNING_NEXT_KEY_ID:-}
      AITEAM_SKILL_SIGNING_CURRENT_NOT_BEFORE: ${AITEAM_SKILL_SIGNING_CURRENT_NOT_BEFORE:-}
      AITEAM_SKILL_SIGNING_CURRENT_EXPIRES_AT: ${AITEAM_SKILL_SIGNING_CURRENT_EXPIRES_AT:-}
      AITEAM_SKILL_SIGNING_NEXT_NOT_BEFORE: ${AITEAM_SKILL_SIGNING_NEXT_NOT_BEFORE:-}
      AITEAM_SKILL_SIGNING_NEXT_EXPIRES_AT: ${AITEAM_SKILL_SIGNING_NEXT_EXPIRES_AT:-}
      AITEAM_SKILL_SIGNING_REVOKED_KEY_IDS: ${AITEAM_SKILL_SIGNING_REVOKED_KEY_IDS:-}
      AITEAM_SKILL_SIGNING_REVOKED_KEYS_JSON: ${AITEAM_SKILL_SIGNING_REVOKED_KEYS_JSON:-}
      AITEAM_COMPOSE_ENV_GUARD_SKILL: ${AITEAM_SKILL_SIGNING_PRIVATE_KEY:+${AITEAM_ENV:?AITEAM_ENV must be explicitly set when skill signing settings are supplied}}
      AITEAM_COMPOSE_ENV_GUARD_SKILL_CURRENT: ${AITEAM_SKILL_SIGNING_CURRENT_PRIVATE_KEY:+${AITEAM_ENV:?AITEAM_ENV must be explicitly set when current skill signing settings are supplied}}
      AITEAM_COMPOSE_ENV_GUARD_SKILL_NEXT: ${AITEAM_SKILL_SIGNING_NEXT_PRIVATE_KEY:+${AITEAM_ENV:?AITEAM_ENV must be explicitly set when next skill signing settings are supplied}}
      LOG_LEVEL: INFO
      EXPOSE_PUBLIC_DOCS: ${EXPOSE_PUBLIC_DOCS:-1}

  # The Docker Agent is a dev/test convenience. Production Agent delivery is a
  # local loopback sidecar; AITEAM_ENV=production intentionally fails closed
  # here rather than exposing a container-wide 0.0.0.0 listener.
  agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    image: ${AITEAM_AGENT_IMAGE:-aiteam-agent:0.1.0}
    container_name: aiteam-agent
    depends_on:
      aiteam-compose-guard:
        condition: service_completed_successfully
    ports:
      - "8003:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AITEAM_AGENT_DATA_DIR: /app/data
      AITEAM_AGENT_DEV_AUTH: ${AITEAM_AGENT_DEV_AUTH:-true}
      AITEAM_PI_FAKE: ${AITEAM_PI_FAKE:-true}
      AITEAM_ENV: ${AITEAM_ENV:?AITEAM_ENV must be explicitly set}
      AITEAM_COMPOSE_MODE: "1"
      AITEAM_MANAGER_URL: ${AITEAM_MANAGER_URL:-http://manager:8000}
      AITEAM_RAG_MCP_URL: ${AITEAM_RAG_MCP_URL:-http://manager:8000/api/manager/rag/mcp}
      # Hindsight credentials are issued per employee by Manager; no global token is mounted here.
      # Public key metadata only; no skill signing private key is mounted in Agent.
      AITEAM_SKILL_SIGNING_PUBLIC_KEYS: ${AITEAM_SKILL_SIGNING_PUBLIC_KEYS:-}
      AITEAM_SKILL_SIGNING_PUBLIC_KEY: ${AITEAM_SKILL_SIGNING_PUBLIC_KEY:-}
      AITEAM_SKILL_SIGNING_KEY_ID: ${AITEAM_SKILL_SIGNING_KEY_ID:-skills-dev-current}
      AITEAM_SKILL_SIGNING_OFFLINE_TTL_SECONDS: ${AITEAM_SKILL_SIGNING_OFFLINE_TTL_SECONDS:-86400}
      AITEAM_AGENT_JWKS_JSON: ${AITEAM_AGENT_JWKS_JSON:-}
      AITEAM_AGENT_JWKS_PATH: ${AITEAM_AGENT_JWKS_PATH:-}
      AITEAM_AGENT_JWT_ISSUER: ${AITEAM_AGENT_JWT_ISSUER:-}
      AITEAM_AGENT_JWT_AUDIENCE: ${AITEAM_AGENT_JWT_AUDIENCE:-}
      AITEAM_COMPOSE_ENV_GUARD_SKILL: ${AITEAM_SKILL_SIGNING_PUBLIC_KEY:+${AITEAM_ENV:?AITEAM_ENV must be explicitly set when skill signing settings are supplied}}
      AITEAM_COMPOSE_ENV_GUARD_SKILL_SET: ${AITEAM_SKILL_SIGNING_PUBLIC_KEYS:+${AITEAM_ENV:?AITEAM_ENV must be explicitly set when skill signing metadata is supplied}}
      AITEAM_COMPOSE_ENV_GUARD_JWT: ${AITEAM_AGENT_JWT_ISSUER:+${AITEAM_ENV:?AITEAM_ENV must be explicitly set when JWT settings are supplied}}
      AITEAM_COMPOSE_ENV_GUARD_FAUX: ${AITEAM_PI_FAKE:+${AITEAM_ENV:?AITEAM_ENV must be explicitly set when faux runtime settings are supplied}}
      AITEAM_AGENT_SANDBOX_READY: ${AITEAM_AGENT_SANDBOX_READY:-false}
      AITEAM_AGENT_SPA_ROOT: /app/web/agent/dist
    networks: [control-plane]
    # Agent owns local SQLite/session state and reaches Manager over HTTP; it
    # has no control-plane PostgreSQL/NewAPI network access.

networks:
  control-plane:
    internal: true
  control-plane-db:
    internal: true
  operation-newapi:
    internal: true
  lightrag-internal:
    internal: true
  newapi-internal:
    internal: true

volumes:
  newapi_pgdata:
    name: ${NEWAPI_PG_VOLUME:-aiteam_newapi_pg_data_${AITEAM_ENV:?AITEAM_ENV must be explicitly set}}
  newapi_redisdata:
    name: ${NEWAPI_REDIS_VOLUME:-aiteam_newapi_redis_data_${AITEAM_ENV:?AITEAM_ENV must be explicitly set}}
  newapi_data:
    name: ${NEWAPI_DATA_VOLUME:-aiteam_newapi_data_${AITEAM_ENV:?AITEAM_ENV must be explicitly set}}
  newapi_logs:
    name: ${NEWAPI_LOG_VOLUME:-aiteam_newapi_logs_${AITEAM_ENV:?AITEAM_ENV must be explicitly set}}
  lightrag_pgdata:
    name: ${LIGHTRAG_PG_VOLUME:-aiteam_lightrag_pg_data_${AITEAM_ENV:?AITEAM_ENV must be explicitly set}}
  # 实际卷名由 ENV 的 MANAGER_DATA_VOLUME 决定（ctl.sh 缺省注入 managerdata_<env>，
  # 使 dev/test/prod 各用各卷）；未注入时回退共用卷 managerdata。
  managerdata:
    name: ${MANAGER_DATA_VOLUME:-managerdata_${AITEAM_ENV:?AITEAM_ENV must be explicitly set}}
  # 实际卷名由 ENV 的 POSTGRES_VOLUME 决定（ctl.sh 缺省注入 aiteam_pg_data_<env>，
  # 使 dev/test/prod 各用各卷）；未注入时回退共用卷 aiteam_pg_data。
  pgdata:
    name: ${POSTGRES_VOLUME:-aiteam_pg_data_${AITEAM_ENV:?AITEAM_ENV must be explicitly set}}
