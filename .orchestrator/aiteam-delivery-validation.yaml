  title: Phase 0 - 固化三端产品可交付验收口径与 blocking 规则
  description: '## 背景

    Parent: AITEAM-202 / 9daa0330-60b7-4dd0-b3c9-8ab43a9888b4。

    基线分支：feature/v1.0.0。

    目标不是开始写集成测试代码，而是先把“产品功能可交付”的统一口径固化成后续所有实现卡的 source-of-truth。


    ## 目标

    产出正式的交付验收口径文档/PR，覆盖：

    - P0/P1 范围边界

    - 三条跨端核心闭环：企业开通、授权生效、运行计费审计

    - 外部依赖与测试替身边界：provider/registry/model sandbox 或 fake 口径

    - eventual consistency：usage/audit/quota/outbox/snapshot/grants sync 最大等待窗口与最终断言

    - blocking 规则：哪些失败阻断 PR/merge/release，哪些仅 nightly 观察


    ## 非目标

    - 不实现具体 service integration/browser e2e/CI job。

    - 不改共享 API contract 或数据库 schema。


    ## 交付物

    - PR 指向 feature/v1.0.0，更新 issue 配套文档或 docs 下验收计划文档。

    - issue metadata 写 artifacts.pr_url、verification.commands。

    - reviewer 复核后给 review_verdict。


    ## 验收

    - 后续 p1/p2/p3/p4/p5 节点可以引用该文档作为唯一交付口径。

    - 明确 closeout owner 为 hermes-orchestrator，最终 closeout 节点为 closeout-delivery-validation-plan。

    '
  reviewer: hermes-reviewer
  risk: high
- id: p1-test-foundation-plan
  worker: codex-ubuntu
  blocked_by:
  - p0-delivery-contract
  title: Phase 1 - 测试底座与依赖边界任务计划
  description: '## 背景

    依赖 p0-delivery-contract 的验收口径。只做任务计划和可执行拆解，不开始大规模实现。


    ## 目标

    产出真实 PostgreSQL + migrations、seed/fixture、tenant bootstrap、角色化 auth/session、artifact
    归档、usage/audit/quota/rollup 可断言辅助能力的任务计划。


    ## 要求

    - 盘点现有测试底座与缺口，锚定具体目录/命令。

    - 拆出后续实现卡建议：PG/migration fixture、角色凭据 fixture、test data lifecycle、artifact upload、eventual
    consistency helper。

    - 明确哪些是 Wave 0 硬前置，哪些可与业务测试并行。

    - 明确 PR quick gate 可先接入的 quick subset。


    ## 非目标

    - 不补完整 service integration/browser e2e 用例。

    - 不引入不可控第三方实时依赖作为主 CI 阻断源。


    ## 交付物

    - PR 指向 feature/v1.0.0，提交计划文档或 manifest 补充。

    - metadata.artifacts.pr_url + verification.commands。

    '
  reviewer: hermes-reviewer
  risk: high
- id: p2-service-integration-plan
  worker: claude-ubuntu
  blocked_by:
  - p0-delivery-contract
  - p1-test-foundation-plan
  title: Phase 2 - 三端 Service Integration 任务计划
  description: '## 背景

    依赖交付口径与测试底座计划。目标是服务层真实闭环的任务拆解。


    ## 目标

    产出 Service Integration 后续实现 DAG：

    - Operator system admin 登录、企业创建、rollups ingest/board/detail

    - Manager tenant/owner bootstrap、whoami、成员/部门/角色/授权/tenant isolation/越权负例

    - Manager capability/provider credentials/knowledge/bindings/recruit/solutions/snapshot

    - Agent Manager 凭据登录、whoami、grants sync、workspace 授权专家/快照可见

    - Agent conversation/message/run/group-dispatch/timeline/loop

    - usage outbox flush、Manager usage rollup/audit/quota、Operator rollup 可见

    - 所有 /api/* 错误为 application/problem+json，禁止 text/html / SPA fallback


    ## 要求

    - 按三条跨端闭环 A/B/C 拆，不按端内 CRUD 平铺。

    - 每条闭环都必须有正向 + 负向覆盖。

    - 标明共享 contract/fixture 依赖与可并行 track。


    ## 交付物

    - PR 指向 feature/v1.0.0，提交服务集成测试实施计划/manifest 补充。

    - metadata.artifacts.pr_url + verification.commands。

    '
  reviewer: hermes-reviewer
  risk: high
- id: p3-browser-e2e-plan
  worker: codex-macmini
  blocked_by:
  - p0-delivery-contract
  - p1-test-foundation-plan
  title: Phase 3 - Operator/Manager/Agent Browser E2E 任务计划
  description: '## 背景

    依赖交付口径与测试底座计划。目标是浏览器真实用户路径的任务拆解，避免重复服务层细节。


    ## 目标

    产出 Browser E2E 后续实现 DAG：

    - Operator：登录、企业开通、catalog 列表/详情/发布/取消发布/可见性、rollup board/detail、API 非 text/html
    断言

    - Manager：owner 首登/重置/登录、成员/部门/grants/knowledge/capability/provider credentials/recruit/solution/usage/audit/quota/snapshot

    - Agent：登录、workspace 授权对象、conversation/message/timeline/run/group dispatch/loop/grants
    sync/usage flush


    ## 要求

    - 采用 Playwright 多角色 auth/storageState 策略。

    - 每个 E2E 只断言用户路径与跨端闭环相关状态，不承担全部后端细节验证。

    - 明确 artifact：report/trace/screenshot/video。


    ## 交付物

    - PR 指向 feature/v1.0.0，提交浏览器 E2E 实施计划/manifest 补充。

    - metadata.artifacts.pr_url + verification.commands。

    '
  reviewer: hermes-reviewer
  risk: high
- id: p4-ci-gates-plan
  worker: claude-macmini
  blocked_by:
  - p0-delivery-contract
  - p1-test-foundation-plan
  title: Phase 4 - PR/merge/nightly/pre-deploy CI 分层门禁任务计划
  description: '## 背景

    依赖交付口径与测试底座计划。目标是把测试计划落成可阻断回归的 CI gate 设计。


    ## 目标

    产出 CI 分层门禁任务计划：

    - PR quick gate：server unit + integration quick subset、API contract matrix、web
    typecheck/test/build、branch coverage gate、Playwright smoke subset

    - merge full gate：完整 Service Integration、完整 Browser E2E、Playwright artifact 上传

    - nightly/pre-deploy：更多数据组合、Chromium 必跑、Firefox/WebKit 可选、近部署环境启动、真实部署只读 smoke（如环境允许）


    ## 要求

    - 明确各 gate 的阻断语义与耗时预算。

    - 明确失败 artifact 与诊断路径。

    - 明确哪些失败允许 nightly 挂红但不阻断 PR。


    ## 交付物

    - PR 指向 feature/v1.0.0，提交 CI gate 计划/manifest 补充。

    - metadata.artifacts.pr_url + verification.commands。

    '
