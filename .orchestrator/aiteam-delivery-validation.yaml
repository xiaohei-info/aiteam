  description: '## 背景

    这是本轮任务计划 closeout 节点。必须汇总上游所有计划产物，形成最终可执行 DAG 与 sign-off 口径。


    ## 目标

    - 汇总 P0/P1、三条核心闭环、Service Integration、Browser E2E、CI gates 的任务计划。

    - 输出最终执行 DAG：节点、依赖、建议 worker/reviewer、验收命令、阻断规则、已知风险。

    - 明确下一阶段如果进入实现，应如何运行 parallel-dev-orchestration 引擎。

    - 记录本轮 Orchestrator/executor skill 使用中暴露的问题；如果确认是 skill/repo 问题，给 https://github.com/xiaohei-info/parallel-dev-skills
    提 issue，并在 closeout 中列出链接。


    ## 非目标

    - 不自行合并所有上游 PR；只给出交付计划的最终判断和下一步。


    ## 交付物

    - PR 指向 feature/v1.0.0，提交最终计划/manifest。

    - metadata.artifacts.pr_url + verification.commands。

    - reviewer 通过后，本 parent issue 可由 hermes-orchestrator 汇总阶段状态。

    '
