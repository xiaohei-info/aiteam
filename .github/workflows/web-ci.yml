name: v1-web-ci

# v1 三端前端（web/）的 CI 质量闸门（防跑偏的客观防线）。
# 与 server 的 ci.yml 解耦：各自按 paths 独立触发，互不误触——
# server-only 改动不跑前端、web-only 改动不跑 server。
#
# 覆盖：typecheck（tsc）+ 单测（vitest）+ 构建（vite build）三者全绿才算过。
# 堵住「web/** 任何改动都不触发任何 CI、前端校验从没在 CI 上真跑过」的假绿漏洞
# （本轮 W-O/W-M/W-A 前端 PR 此前仅靠本地 + 人工盲审把关）。
#
# 注：仅作用于 v1 新前端 web/；不引入 lint（各包当前无 lint script，不在范围）。

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    # master = 终态总控边界；feature/** = v1 开发期的集成分支（PR 多打到这里）。
    # 两者都触发，覆盖棘轮才能在开发期就守住集成分支、不必等大合并。
    branches: ["master", "feature/**"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  typecheck-test-build:
    name: typecheck + 单测 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm 版本固定为 web/package.json 的 packageManager（11.4.0），经 corepack 激活，
      # 与本地/锁文件一致，避免版本漂移导致的 install 差异。
      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install deps (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 消费端（operation/manager/agent）经 package.json exports 把 @aiteam/shared/*
      # 解析到 shared/dist（无 TS project references），故 typecheck/test/build 前必须先
      # 产出 shared 的 dist；否则干净检出下 @aiteam/shared/* 子路径全部解析失败。
      - name: Build shared (prereq for consumers)
        working-directory: web
        run: pnpm --filter @aiteam/shared run build

      - name: Typecheck
        working-directory: web
        run: pnpm -r typecheck

      - name: Test
        working-directory: web
        run: pnpm -r test

      - name: Build
        working-directory: web
        run: pnpm -r build

  playwright-smoke:
    name: Playwright smoke（三端真实装配）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manager_control_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manager_control_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DB_URL: postgresql://postgres:postgres@localhost:5432/manager_control_db
      DB_URL: postgresql://app_rw:apprwpass@localhost:5432/manager_control_db
      APP_RW_PASSWORD: apprwpass
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install server deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r server/requirements.txt pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared (prereq for consumers)
        working-directory: web
        run: pnpm --filter @aiteam/shared run build

      - name: Run Playwright smoke
        working-directory: web
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces/screenshots/videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore

  branch-coverage-ratchet:
    name: 分支覆盖棘轮（PR→master 不退化）
    runs-on: ubuntu-latest
    # 总控门：仅在 PR 时跑（PR→master 与 PR→feature/** 均触发，push 不跑）。
    # 双层：CI 物理层 diff-cover --fail-under=90 改动分支覆盖门 + 棘轮总覆盖不退化兜底。
    # 引入覆盖能力的首个 PR：base(master) 尚无 @vitest/coverage-v8 → base 跑不出覆盖，
    # 自动跳过比对（bootstrap）；合并后 master 即基线，后续 PR 起真比对。
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      - name: Checkout base (master)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: 覆盖率 - PR head（四包聚合分支覆盖）
        working-directory: head/web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @aiteam/shared run build
          pnpm -r exec vitest run --coverage
          node -e 'const fs=require("fs");let t=0,c=0,n=0;for(const p of ["shared","operation","manager","agent"]){const f=p+"/coverage/coverage-summary.json";if(!fs.existsSync(f))continue;const b=JSON.parse(fs.readFileSync(f)).total.branches;t+=b.total;c+=b.covered;n++;}if(n<4){console.error("缺包覆盖产物 n="+n);process.exit(2);}const pct=(c/t*100).toFixed(2);fs.writeFileSync(process.env.RUNNER_TEMP+"/head.txt",pct);console.log("head web 分支覆盖 "+pct+"% ("+c+"/"+t+")");'
          # 合并四包 lcov.info 并重写 SF: 路径为 git-root-relative（web/<pkg>/src/...）
          # 供 diff-cover 吃 lcov 格式（diff-cover 按 git diff 路径匹配）
          for pkg in shared operation manager agent; do
            if [ -f "$pkg/coverage/lcov.info" ]; then
              sed "s|^SF:src/|SF:web/$pkg/src/|" "$pkg/coverage/lcov.info" >> "$RUNNER_TEMP/web-lcov.info"
            fi
          done

      - name: 覆盖率 - base master（容忍未 instrumented）
        working-directory: base/web
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @aiteam/shared run build
          pnpm -r exec vitest run --coverage
          node -e 'const fs=require("fs");let t=0,c=0,n=0;for(const p of ["shared","operation","manager","agent"]){const f=p+"/coverage/coverage-summary.json";if(!fs.existsSync(f))continue;const b=JSON.parse(fs.readFileSync(f)).total.branches;t+=b.total;c+=b.covered;n++;}if(n<1){process.exit(2);}const pct=(c/t*100).toFixed(2);fs.writeFileSync(process.env.RUNNER_TEMP+"/base.txt",pct);console.log("base web 分支覆盖 "+pct+"%");'

      - name: Setup Python（diff-cover 门）
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 改动分支覆盖门槛（diff-cover ≥90%）
        # F2: web 前端 CI 物理层 diff-cover 门——改动行分支覆盖 <90% → CI 红灯。
        # lcov.info 路径已重写为 git-root-relative，diff-cover 从 head/ 运行。
        # 该步不含 continue-on-error：硬门槛，低于阈值必须 block PR。
        working-directory: head
        run: |
          pip install diff-cover
          diff-cover "$RUNNER_TEMP/web-lcov.info" \
            --compare-branch=${{ github.event.pull_request.base.sha }} \
            --fail-under=90

      - name: 棘轮比对（head ≥ base 否则红灯）
        run: |
          HEAD=$(cat "$RUNNER_TEMP/head.txt")
          if [ ! -f "$RUNNER_TEMP/base.txt" ]; then
            echo "::notice::base(master) 尚未具备覆盖工具（首次引入），跳过棘轮比对；head=${HEAD}%。合并后 master 即为基线。"
            exit 0
          fi
          BASE=$(cat "$RUNNER_TEMP/base.txt")
          python3 -c "import sys; h=float('${HEAD}'); b=float('${BASE}'); print(f'base(master) 分支覆盖: {b:.2f}%'); print(f'head(PR)     分支覆盖: {h:.2f}%'); sys.exit(1 if h + 0.01 < b else 0)" || {
            echo "::error::web 分支覆盖回退 ${BASE}% → ${HEAD}%——PR 不得降低 master 总覆盖（补测试后再合）"; exit 1; }
          echo "OK：web 总分支覆盖未退化"
