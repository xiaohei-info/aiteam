#
# Branch 相关约定
# ==============
#
# PR trigger (自动):
#   on.pull_request.branches      ← 指定 PR 合入哪个分支才触发 deploy
#   运行时 pull 的分支            ← github.event.pull_request.base.ref (即目标分支)
#
# workflow_dispatch (手动):
#   inputs.branch                 ← 用户必须提供
#
# run.sh 里对空 branch 显式 fail: "branch is required: ..."
# 没有任何 fallback；不传 branch 就是错。

name: deploy (main -> taiyi)

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (must exist on remote)"
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

env:
  # 分支解析：手动触发取自 inputs，PR 触发取自 base.ref。
  # 显式拒绝任何 fallback 语义；漏填即 fail。
  DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.event.pull_request.base.ref }}
  DEPLOY_ENV: "test"
  # 持久化部署根：这是个独立的 git 仓库目录；不需要在 runner workspace 上 checkout。
  DEPLOY_ROOT: /root/app/aiteam
  UNIT_NAME: aiteam-v1

jobs:
  deploy:
    name: deploy (main -> taiyi)
    # workflow_dispatch runs have no pull_request.merged context,
    # so guard with event_name check; otherwise the job gets skipped.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.branch != '')
      ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)
    runs-on: taiyi
    timeout-minutes: 15

    steps:
      # 让 runner 拿到 workflow 自身引用，确保 job 能正确执行 deploy/ci/run.sh。
      - name: Checkout workflow source
        uses: actions/checkout@v4

      # 把 .env.<env> 写到部署根（ctl.sh 从 $DEPLOY_ROOT/.env.<env> 读）
      # 这步必须在 git pull 之前，.env.<env> 是 gitignored，pull 不会动它。
      - name: Write .env.${{ env.DEPLOY_ENV }} from GitHub secret
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          if [[ -z "${{ env.DEPLOY_BRANCH }}" ]]; then
            echo "::error::DEPLOY_BRANCH empty; abort."; exit 2
          fi
          cat > ".env.${{ env.DEPLOY_ENV }}" << 'ENVEOF'
          ${{ secrets.ENV_CONTENTS_TEST }}
          ENVEOF
          if ! grep -q '[^[:space:]]' ".env.${{ env.DEPLOY_ENV }}"; then
            echo "::error::.env.${{ env.DEPLOY_ENV }} is empty -- check GitHub secret ENV_CONTENTS_${{ env.DEPLOY_ENV }}"
            exit 1
          fi
          echo "wrote .env.${{ env.DEPLOY_ENV }} ($(wc -l < ".env.${{ env.DEPLOY_ENV }}") lines)"

      # 部署编排：在部署根跑 run.sh，它会完成 git pull + 前端 build + 装 unit +
      #   systemctl restart + /healthz smoke。
      - name: Deploy via run.sh
        working-directory: ${{ env.DEPLOY_ROOT }}
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_BRANCH}" ]]; then
            echo "::error::DEPLOY_BRANCH empty at run.sh time"; exit 2
          fi
          bash "${{ github.workspace }}/deploy/ci/run.sh" \
            --branch "${DEPLOY_BRANCH}" \
            --env "${DEPLOY_ENV}" \
            --unit "${UNIT_NAME}"

      # 补救信息（无论 deploy 成功/失败都 dump 日志）。
      - name: Post-deploy debug dump
        if: always()
        shell: bash
        run: |
          systemctl status "$UNIT_NAME" --no-pager -n 0 || true
          echo "---"
          for f in "$DEPLOY_ROOT/logs/manager.log" \
                   "$DEPLOY_ROOT/logs/operation.log" \
                   "$DEPLOY_ROOT/logs/agent.log"; do
            echo "=== $f (tail 15) ==="
            tail -n 15 "$f" 2>/dev/null || true
          done
