#
# Branch 相关约定
# ==============
#
# PR trigger (自动):
#   on.pull_request.branches      ← 指定 PR 合入哪个分支才触发 deploy
#   运行时 pull 的分支            ← github.event.pull_request.base.ref (即目标分支)
#
# workflow_dispatch (手动):
#   inputs.branch                 ← 用户必须提供
#
# run.sh 里对空 branch 显式 fail: "branch is required: ..."
# 没有任何 fallback；不传 branch 就是错。

name: deploy (main -> taiyi)

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (must exist on remote)"
        required: true
        type: string
      agent_public:
        description: "Expose secure TEST Agent on 8783 (false restores loopback only)"
        required: true
        default: true
        type: boolean
      control_plane_public:
        description: "Expose TEST Manager/Operation on 8782/8781 (false restores loopback only)"
        required: true
        default: true
        type: boolean
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# The deployment root is a single-writer resource. Queue manual/merge deploys
# instead of letting two self-hosted jobs build and restart it concurrently.
concurrency:
  group: deploy-taiyi-test
  cancel-in-progress: false

env:
  # 分支解析：手动触发取自 inputs，PR 触发取自 base.ref。
  # 显式拒绝任何 fallback 语义；漏填即 fail。
  DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.event.pull_request.base.ref }}
  DEPLOY_ENV: "test"
  # taiyi runs the self-hosted service as root and currently starts the runner
  # without HOME; Git must see the same global safe-directory config in every step.
  HOME: /root
  # 持久化部署根：这是个独立的 git 仓库目录；不需要在 runner workspace 上 checkout。
  DEPLOY_ROOT: /root/app/aiteam
  UNIT_NAME: aiteam-v1

jobs:
  deploy:
    name: deploy (main -> taiyi)
    # workflow_dispatch runs have no pull_request.merged context,
    # so guard with event_name check; otherwise the job gets skipped.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.branch != '')
      ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)
    runs-on: taiyi
    timeout-minutes: 15

    steps:
      # 部署根是 self-hosted 主机上的持久化 git checkout；不在 runner workspace
      # checkout，避免 GitHub HTTPS/TLS 短暂不可达时在真正部署前失败。
      # deploy/ci/run.sh 随部署根代码同步，脚本随后用其 SSH origin 拉取目标分支。
      - name: Validate persistent deployment root
        shell: bash
        run: |
          set -euo pipefail
          [[ -d "${DEPLOY_ROOT}" ]] || { echo "::error::${DEPLOY_ROOT} is missing; bootstrap it per deploy/ci/README.md"; exit 1; }
          # The persistent checkout is intentionally owned by the deploy user,
          # while the runner service may use another account. The runner unit
          # currently does not export HOME, so provide a writable Git config home.
          export HOME="${HOME:-/root}"
          git config --global --add safe.directory "${DEPLOY_ROOT}"
          cd "${DEPLOY_ROOT}"
          [[ -d .git ]] || { echo "::error::${DEPLOY_ROOT} is not a git repository; bootstrap it per deploy/ci/README.md"; exit 1; }
          [[ -x deploy/ci/run.sh ]] || { echo "::error::deploy/ci/run.sh missing or not executable in ${DEPLOY_ROOT}"; exit 1; }
          [[ -x scripts/ctl.sh ]] || { echo "::error::scripts/ctl.sh missing or not executable in ${DEPLOY_ROOT}"; exit 1; }
          [[ -x .venv/bin/python ]] || { echo "::error::.venv/bin/python missing; install server requirements per deploy/ci/README.md"; exit 1; }
          command -v node >/dev/null || { echo "::error::node is required on the self-hosted runner"; exit 1; }
          command -v pnpm >/dev/null || { echo "::error::pnpm is required on the self-hosted runner"; exit 1; }
          command -v docker >/dev/null || { echo "::error::docker is required on the self-hosted runner"; exit 1; }
          docker info >/dev/null || { echo "::error::runner user cannot access the Docker daemon"; exit 1; }
          docker compose version >/dev/null || { echo "::error::Docker Compose v2 is required on the self-hosted runner"; exit 1; }
          systemctl --version >/dev/null || { echo "::error::systemd is required on the self-hosted runner"; exit 1; }
          origin="$(git remote get-url origin)"
          [[ "${origin}" == git@github.com:* || "${origin}" == ssh://git@github.com/* ]] || {
            echo "::error::deployment origin must use GitHub SSH (got ${origin})"; exit 1;
          }
          timeout 20 git ls-remote origin "refs/heads/${DEPLOY_BRANCH}" | grep -q . || {
            echo "::error::cannot read origin branch ${DEPLOY_BRANCH} over SSH"; exit 1;
          }

      - name: Back up current release configuration
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          umask 077
          backup="/root/app/aiteam-release-backups/${GITHUB_RUN_ID}"
          mkdir -p "${backup}"
          chmod 700 "${backup}"
          [[ ! -f ".env.${DEPLOY_ENV}" ]] || cp -p ".env.${DEPLOY_ENV}" "${backup}/env.before"
          git rev-parse HEAD > "${backup}/ref.before"
          systemctl cat "${UNIT_NAME}" > "${backup}/unit.before"
          chmod 600 "${backup}"/*
          echo "Protected release backup: ${backup}"

      # 把 .env.<env> 写到部署根（ctl.sh 从 $DEPLOY_ROOT/.env.<env> 读）
      # 这步必须在 git pull 之前，.env.<env> 是 gitignored，pull 不会动它。
      - name: Write .env.${{ env.DEPLOY_ENV }} from GitHub secret
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${{ env.DEPLOY_BRANCH }}" ]]; then
            echo "::error::DEPLOY_BRANCH empty; abort."; exit 2
          fi
          env_file=".env.${DEPLOY_ENV}"
          cat > "${env_file}" << 'ENVEOF'
          ${{ secrets.ENV_CONTENTS_TEST }}
          ENVEOF
          # This release explicitly enables the requested TEST-only onboarding
          # verification. ctl.sh has no implicit bypass and production ignores it.
          printf '%s\n' 'AITEAM_TEST_ENABLE_ONBOARDING_WRITES=true' >> "${env_file}"
          chmod 600 "${env_file}"
          # Keep host-generated component credentials when the repository secret
          # predates a component rollout. Values from the secret always win;
          # only absent keys are recovered from the latest local backup.
          fallback="$(find . -maxdepth 1 -type f -name ".env.${DEPLOY_ENV}.bak.*" -print | sort | tail -1 || true)"
          if [[ -n "${fallback}" ]]; then
            for key in \
              AITEAM_SKILL_SIGNING_PRIVATE_KEY AITEAM_SKILL_SIGNING_KEY_ID \
              AITEAM_SKILL_SIGNING_CURRENT_PRIVATE_KEY AITEAM_SKILL_SIGNING_CURRENT_KEY_ID \
              AITEAM_SKILL_SIGNING_NEXT_PRIVATE_KEY AITEAM_SKILL_SIGNING_NEXT_KEY_ID \
              AITEAM_SKILL_SIGNING_CURRENT_NOT_BEFORE AITEAM_SKILL_SIGNING_CURRENT_EXPIRES_AT \
              AITEAM_SKILL_SIGNING_NEXT_NOT_BEFORE AITEAM_SKILL_SIGNING_NEXT_EXPIRES_AT \
              AITEAM_SKILL_SIGNING_REVOKED_KEY_IDS AITEAM_SKILL_SIGNING_REVOKED_KEYS_JSON \
              MANAGER_CREDENTIAL_KEY LIGHTRAG_URL LIGHTRAG_API_KEY LIGHTRAG_INSTANCES \
              HINDSIGHT_URL HINDSIGHT_SERVICE_TOKEN; do
              if ! grep -Eq "^${key}=.+" "${env_file}"; then
                line="$(grep -E "^${key}=" "${fallback}" | tail -1 || true)"
                [[ -n "${line}" ]] && printf '%s\n' "${line}" >> "${env_file}"
              fi
            done
          fi
          if ! grep -q '[^[:space:]]' "${env_file}"; then
            echo "::error::${env_file} is empty -- check GitHub secret ENV_CONTENTS_${DEPLOY_ENV}"
            exit 1
          fi
          echo "wrote ${env_file} ($(wc -l < "${env_file}") lines)"

      # The Secret above carries the whole env file and cannot be read back, so the
      # externally reachable relay URL is overridden from a repository variable
      # (Settings -> Secrets and variables -> Actions -> Variables). Empty keeps the
      # Secret value. Only the URL is printed; no other env content reaches the log.
      - name: Override NEWAPI_PUBLIC_BASE_URL from repository variable
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}
        env:
          NEWAPI_PUBLIC_BASE_URL_OVERRIDE: ${{ vars.NEWAPI_PUBLIC_BASE_URL_TEST }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${DEPLOY_ENV}" == test && "${DEPLOY_ROOT}" == /root/app/aiteam ]]
          if [[ -z "${NEWAPI_PUBLIC_BASE_URL_OVERRIDE}" ]]; then
            echo "NEWAPI_PUBLIC_BASE_URL_TEST not set; keeping the value from the env Secret"
            exit 0
          fi
          # Absolute HTTPS URL ending in /v1, no credentials/query/whitespace (same contract as Operation).
          if [[ ! "${NEWAPI_PUBLIC_BASE_URL_OVERRIDE}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~-]+)*/v1$ ]]; then
            echo "::error::NEWAPI_PUBLIC_BASE_URL_TEST must be an absolute https URL ending in /v1"; exit 1
          fi
          env_file=".env.${DEPLOY_ENV}"
          tmp="$(mktemp "${env_file}.XXXXXX")"
          { grep -v '^NEWAPI_PUBLIC_BASE_URL=' "${env_file}" || true; } > "${tmp}"
          printf 'NEWAPI_PUBLIC_BASE_URL=%s\n' "${NEWAPI_PUBLIC_BASE_URL_OVERRIDE}" >> "${tmp}"
          chmod 600 "${tmp}"
          mv -f "${tmp}" "${env_file}"
          echo "NEWAPI_PUBLIC_BASE_URL overridden to ${NEWAPI_PUBLIC_BASE_URL_OVERRIDE}"

      - name: Persist taiyi TEST Manager and Operation listener configuration
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${DEPLOY_ENV}" == test && "${DEPLOY_ROOT}" == /root/app/aiteam && "${UNIT_NAME}" == aiteam-v1 ]]
          source ".env.${DEPLOY_ENV}"
          [[ "${MANAGER_PORT:-8782}" == 8782 && "${OPERATION_PORT:-8781}" == 8781 ]]
          # Restore the historical TEST listeners after each Secret env rewrite.
          # Only these two host keys change; credentials and dependency bindings do not.
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.control_plane_public }}" == false ]]; then
            printf '%s\n' 'MANAGER_HOST=127.0.0.1' 'OPERATION_HOST=127.0.0.1' >> ".env.${DEPLOY_ENV}"
          else
            printf '%s\n' 'MANAGER_HOST=0.0.0.0' 'OPERATION_HOST=0.0.0.0' >> ".env.${DEPLOY_ENV}"
          fi
          chmod 600 ".env.${DEPLOY_ENV}"

      - name: Persist taiyi TEST Agent public login configuration
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${DEPLOY_ENV}" == test && "${DEPLOY_ROOT}" == /root/app/aiteam && "${UNIT_NAME}" == aiteam-v1 ]]
          # This step restores the historical public Agent listener independently.
          # Database bindings and ctl's defaults remain unchanged.
          source ".env.${DEPLOY_ENV}"
          [[ "${AGENT_PORT:-8783}" == 8783 && "${MANAGER_PORT:-8782}" == 8782 ]]
          [[ -z "${AITEAM_AGENT_JWKS_JSON:-}" && -z "${AITEAM_AGENT_JWKS_PATH:-}" ]] || { echo '::error::Static JWKS conflicts with Manager mode'; exit 1; }
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.agent_public }}" == false ]]; then
            printf '%s\n' 'AGENT_HOST=127.0.0.1' 'AITEAM_AGENT_LOCAL_ONLY=true' >> ".env.${DEPLOY_ENV}"
          else
            printf '%s\n' 'AGENT_HOST=0.0.0.0' 'AITEAM_AGENT_LOCAL_ONLY=false' >> ".env.${DEPLOY_ENV}"
          fi
          printf '%s\n' 'AITEAM_AGENT_DEV_AUTH=false' 'AITEAM_AGENT_JWKS_MODE=manager' 'AITEAM_MANAGER_URL=http://127.0.0.1:8782' >> ".env.${DEPLOY_ENV}"
          printf 'AITEAM_AGENT_JWT_ISSUER=%q\nAITEAM_AGENT_JWT_AUDIENCE=%q\n' "${AITEAM_JWT_ISSUER-aiteam-manager}" "${AITEAM_JWT_AUDIENCE-aiteam-agent}" >> ".env.${DEPLOY_ENV}"
          chmod 600 ".env.${DEPLOY_ENV}"

      # 部署编排：先从 origin/$DEPLOY_BRANCH 只刷新 deploy/ci/run.sh，再执行它。
      # 持久化根上的旧 inode 不会加载新的 requirements-sync；GHA YAML 来自触发
      # ref，因此必须在第一次调用前检出远程编排脚本。run.sh 随后完整 checkout 其余树。
      - name: Deploy via run.sh
        working-directory: ${{ env.DEPLOY_ROOT }}
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_BRANCH}" ]]; then
            echo "::error::DEPLOY_BRANCH empty at run.sh time"; exit 2
          fi
          export HOME="${HOME:-/root}"
          git config --global --add safe.directory "${DEPLOY_ROOT}"
          git fetch origin "${DEPLOY_BRANCH}"
          git checkout "origin/${DEPLOY_BRANCH}" -- deploy/ci/run.sh
          [[ -x deploy/ci/run.sh ]] || {
            echo "::error::deploy/ci/run.sh missing or not executable after origin refresh"
            exit 1
          }
          bash "${{ env.DEPLOY_ROOT }}/deploy/ci/run.sh" \
            --branch "${DEPLOY_BRANCH}" \
            --env "${DEPLOY_ENV}" \
            --unit "${UNIT_NAME}"

      # 补救信息（无论 deploy 成功/失败都 dump 日志）。
      - name: Post-deploy debug dump
        if: always()
        shell: bash
        run: |
          systemctl status "$UNIT_NAME" --no-pager -n 0 || true
          echo "---"
          for f in "$DEPLOY_ROOT/logs/manager.log" \
                   "$DEPLOY_ROOT/logs/operation.log" \
                   "$DEPLOY_ROOT/logs/agent.log"; do
            echo "=== $f (tail 15) ==="
            tail -n 15 "$f" 2>/dev/null || true
          done
