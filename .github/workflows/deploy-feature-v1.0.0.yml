# PR 合并到 feature/v1.0.0 时，自动部署到 taiyi（测试机）。
#
# 三件套（切分支时复制本 yaml 并改这三处即可）：
#   1) on.<event>.branches      ← 触发 PR merge 的分支名（必须放在 "on" 块下）
#   2) jobs.deploy.runs-on      ← 目标机器的 self-hosted runner label
#   3) env.ENV_NAME             ← 环境名（对应 .env.<env> + secret ENV_CONTENTS_<ENV>）
#
# 共享脚本：scripts/deploy/run.sh —— 任何分支都可复制该 yaml 并改三件套共用。
#
# 关键技术细节："on" 键必须加引号。某些 PyYAML 1.x 把裸 `on:` 解析成
# YAML 1.1 布尔值 true，导致整个触发器块丢失，workflow 退化为 push 模式，
# linter 也无法正确解析 jobs 列表。

name: deploy (feature/v1.0.0 → taiyi)

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to deploy (defaults to feature/v1.0.0)"
        required: false
        default: "feature/v1.0.0"
      env:
        description: "target env"
        required: false
        default: "test"
  pull_request:
    branches: [feature/v1.0.0]
    types: [closed]

permissions:
  contents: read

env:
  ENV_NAME: test
  OPERATION_SYSTEM_USERNAME: sysadmin
  OPERATION_SYSTEM_PASSWORD: changeme-me

jobs:
  deploy:
    # ⚠️ job name 禁用 env 上下文——GitHub 会判整个 workflow 文件无效,
    # 每次 push 产生 "workflow file issue" phantom failure(已两次踩坑:b1ad63b 修过一次)。
    name: deploy (feature/v1.0.0 → taiyi / .env.test)
    # workflow_dispatch runs have no pull_request.merged context,
    # so guard with event_name check; otherwise the job gets skipped.
    if: >-
      (github.event_name == 'workflow_dispatch')
      ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)
    runs-on: taiyi
    timeout-minutes: 10

    steps:
      - name: Checkout at merge commit
        uses: actions/checkout@v4

      - name: Write .env.${{ env.ENV_NAME }} from GitHub secret
        shell: bash
        run: |
          cat > ".env.${{ env.ENV_NAME }}" << 'ENVEOF'
          ${{ secrets.ENV_CONTENTS_TEST }}
          ENVEOF
          if ! grep -q '[^[:space:]]' ".env.${{ env.ENV_NAME }}"; then
            echo "::error::.env.${{ env.ENV_NAME }} is empty -- check GitHub secret ENV_CONTENTS_${{ env.ENV_NAME }}"
            exit 1
          fi
          echo "wrote .env.${{ env.ENV_NAME }} ($(wc -l < ".env.${{ env.ENV_NAME }}") lines)"

      - name: Deploy (pull + restart + /healthz smoke)
        shell: bash
        run: |
          bash scripts/deploy/run.sh \
            --branch "${{ github.event.pull_request.base.ref }}" \
            --env "${{ env.ENV_NAME }}"
