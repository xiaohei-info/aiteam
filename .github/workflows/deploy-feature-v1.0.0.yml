# PR 合并到 feature/v1.0.0 时，自动部署到 taiyi（测试机）。
#
# 工作原理：
#   1) actions/checkout 把最新代码拉进 runner workspace
#   2) workflow step 把代码 rsync 到持久化部署根（/root/app/aiteam）
#      同时把 GitHub Secret 写成 $DEPLOY_ROOT/.env.<env>
#   3) 在部署根调用 deploy/ci/run.sh：
#        git fetch --all + checkout + pull --ff-only 目标分支
#        → 装 systemd unit 到 /etc/systemd/system/
#        → systemctl restart aiteam-v1
#        → /healthz 冒烟
#   4) 服务由 systemd (PID 1) 托管；runner job 结束时的 orphan clean-up
#      波及不到 systemd-forked 的 ctl.sh 进程（系统边界），所以服务
#      会在 job 之后继续存活。
#
# 切分支/环境：复制本 yaml，改这三处：
#   1) on.pull_request.branches        ← 触发 PR merge 的目标分支名
#   2) jobs.deploy.runs-on             ← 目标机器的 self-hosted runner label
#   3) env.DEPLOY_ROOT                ← 持久化部署落地绝对路径
#
# 关键技术细节：
#   - "on" 键必须加引号（YAML 1.1 把裸 `on:` 解析成布尔 true）。
#   - 用 env.* 传参给 step（`with:` 只传字面量表达式；workflow_dispatch
#     输入走 `${{ github.event.inputs.* }}`，在 step 内直接引用表达式）。
#   - actions/checkout 不能 path: 到 workspace 之外；所以用 rsync 把
#    workspace 内容同步到部署根，而不是让 checkout 直接写部署根。

name: deploy (feature/v1.0.0 -> taiyi)

"on":
  workflow_dispatch:
  pull_request:
    branches: [feature/v1.0.0]
    types: [closed]

permissions:
  contents: read

env:
  DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.event.pull_request.base.ref || 'feature/v1.0.0' }}
  DEPLOY_ENV: ${{ github.event.inputs.env || 'test' }}
  # 持久化部署根（已预先 git clone 一份仓库 + bootstrap .venv 的位置）
  DEPLOY_ROOT: /root/app/aiteam
  OPERATION_SYSTEM_USERNAME: sysadmin
  OPERATION_SYSTEM_PASSWORD: changeme-me

jobs:
  deploy:
    name: deploy (feature/v1.0.0 -> taiyi)
    if: >-
      (github.event_name == 'workflow_dispatch')
      ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)
    runs-on: taiyi
    timeout-minutes: 15

    steps:
      - name: Checkout codebase into worker workspace
        uses: actions/checkout@v4

      # rsync workspace → 持久化部署根（保持 runner workspace 与部署根一致）
      #  --exclude=.venv 避免覆盖已部署机器本地的 large .venv；
      #  --delete 让部署根里多余文件也被清掉（如已删除的模块）。
      - name: Sync deploy root & write .env
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          mkdir -p "$DEPLOY_ROOT"
          # rsync 整个仓库到部署根（除 .venv）
          rsync -a --delete --exclude='.venv' ./ "$DEPLOY_ROOT/"
          echo "[sync] workspace -> $DEPLOY_ROOT done"
          # 写 .env.<env>（从 GitHub Secret 注入，由 ctl.sh 读取）
          cat > "$DEPLOY_ROOT/.env.${DEPLOY_ENV}" << 'ENVEOF'
          ${{ secrets.ENV_CONTENTS_TEST }}
          ENVEOF
          if ! grep -q '[^[:space:]]' "$DEPLOY_ROOT/.env.${DEPLOY_ENV}"; then
            echo "::error::.env.${DEPLOY_ENV} is empty -- check GitHub secret ENV_CONTENTS_${DEPLOY_ENV}"
            exit 1
          fi
          echo "[sync] wrote $DEPLOY_ROOT/.env.${DEPLOY_ENV} ($(wc -l < "$DEPLOY_ROOT/.env.${DEPLOY_ENV}") lines)"

      # 部署编排：git pull + 装 unit + systemctl restart + healthz smoke
      - name: Deploy (pull + systemd restart + /healthz smoke)
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
        shell: bash
        run: |
          bash "${{ github.workspace }}/deploy/ci/run.sh" \
            --branch "${{ env.DEPLOY_BRANCH }}" \
            --env "${{ env.DEPLOY_ENV }}"

      - name: Post-deploy status dump
        if: always()
        shell: bash
        run: |
          systemctl status aiteam-v1 --no-pager || true
          echo "=== manager.log tail ==="
          tail -n 30 /root/app/aiteam/logs/manager.log 2>/dev/null || true
