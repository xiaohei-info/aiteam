name: deployment-ops-checks

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "deploy/**"
      - "scripts/**"
      - "docs/部署运维/**"
      - ".github/workflows/deploy-ops.yml"
  pull_request:
    branches: [main, "feature/**"]
    paths:
      - "deploy/**"
      - "scripts/**"
      - "docs/部署运维/**"
      - ".github/workflows/deploy-ops.yml"

permissions:
  contents: read

# Compose uses this guard whenever optional skill/JWT settings are present in
# the runner environment.  Keep the CI profile explicit instead of relying on
# an unset shell variable (which makes `docker compose config` fail before any
# deployment checks run).
env:
  AITEAM_ENV: test

jobs:
  deployment-checks:
    name: deployment shell/compose/secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment artifacts
        run: bash scripts/check-deploy.sh
      - name: Check Agent sandbox dry-run entrypoint
        run: bash scripts/check-agent-sandbox.sh --dry-run
      - name: Check LightRAG bootstrap and release dry-runs
        run: |
          bash deploy/lightrag/init-db.sh --dry-run >/tmp/lightrag-init.out
          bash scripts/validate-lightrag-env.sh
          bash scripts/lightrag-ops.sh --dry-run backup
          bash scripts/lightrag-ops.sh --dry-run upgrade --image ghcr.io/hkuds/lightrag:1.5.6
          bash scripts/lightrag-ops.sh --dry-run rollback --image ghcr.io/hkuds/lightrag:1.5.6
