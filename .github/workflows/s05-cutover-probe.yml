name: S05 legacy cutover native probe (NOT deployment)

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/ci/stop_legacy_unit.py"
      - "scripts/verification/s05_systemd_cutover_probe.py"
      - "server/tests/app/test_stop_legacy_unit.py"
      - ".github/workflows/s05-cutover-probe.yml"

permissions:
  contents: read

jobs:
  native-probe:
    name: isolated systemd main-first candidate
    # NEVER self-hosted/taiyi. No deployment, secrets, container or DB operations.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python syntax
        run: python3 -m py_compile deploy/ci/stop_legacy_unit.py scripts/verification/s05_systemd_cutover_probe.py
      - name: Exercise real signals in unique harmless systemd fixtures
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/verification/s05_systemd_cutover_probe.py \
              --hosted-fixture --report-dir "$RUNNER_TEMP/s05-systemd-proof"
      - name: Preserve native evidence (not a rollout approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-systemd-proof-${{ github.sha }}
          path: ${{ runner.temp }}/s05-systemd-proof
          if-no-files-found: error
          retention-days: 14
