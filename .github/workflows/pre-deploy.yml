# G5 — Pre-deploy gate.
# Blocks deployment until staging smoke passes and production readonly smoke
# passes. Wired as two GitHub Environments (staging, production) so environment
# protection rules (required reviewers, deployment branches) gate the rollout.
#
# Non-goal honored: production smoke is READONLY — it only issues GET requests
# to health/static/metadata surfaces and never writes business data.
name: pre-deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging | production | both"
        required: false
        default: "both"
  push:
    branches: [feature/v1.0.0]
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/pre-deploy.yml"

permissions:
  contents: read
  deployments: write

env:
  OPERATION_SYSTEM_USERNAME: sysadmin
  OPERATION_SYSTEM_PASSWORD: changeme-me

jobs:
  staging-smoke:
    name: Staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.AITEAM_STAGING_URL }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manager_control_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manager_control_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DB_URL: postgresql://postgres:postgres@localhost:5432/manager_control_db
      DB_URL: postgresql://app_rw:apprwpass@localhost:5432/manager_control_db
      APP_RW_PASSWORD: apprwpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pytest-timeout
      - name: Staging smoke — PR-quick subset against real PG
        working-directory: server
        run: python -m pytest -q -m "integration and pr_quick" --timeout=300
      - name: Staging endpoint smoke
        if: ${{ vars.AITEAM_STAGING_URL != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request
          base = os.environ["AITEAM_STAGING_URL"].rstrip("/")
          for path in ("/healthz", "/docs"):
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  assert r.status == 200, f"{path} -> {r.status}"
          print("staging endpoint smoke ok")
          PY
        env:
          AITEAM_STAGING_URL: ${{ vars.AITEAM_STAGING_URL }}

  production-readonly-smoke:
    name: Production READONLY smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: staging-smoke
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'production' || github.event.inputs.target == 'both') }}
    environment:
      name: production
      url: ${{ vars.AITEAM_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Production READONLY smoke (GET-only, never writes)
        if: ${{ vars.AITEAM_PRODUCTION_URL != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request
          base = os.environ["AITEAM_PRODUCTION_URL"].rstrip("/")
          # READONLY: GET-only. Never POST/PUT/PATCH/DELETE against production.
          for path in ("/healthz", "/docs"):
              req = urllib.request.Request(base + path, method="GET")
              with urllib.request.urlopen(req, timeout=10) as r:
                  assert r.status == 200, f"{path} -> {r.status}"
          print("production readonly smoke ok")
          PY
        env:
          AITEAM_PRODUCTION_URL: ${{ vars.AITEAM_PRODUCTION_URL }}
      - name: No production URL configured (skip)
        if: ${{ vars.AITEAM_PRODUCTION_URL == '' }}
        run: echo "AITEAM_PRODUCTION_URL not set — production readonly smoke skipped (no endpoint to probe). See docs/ci/runbook.md §'G5'."
