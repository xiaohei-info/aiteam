name: agent-package

# Build portable Agent sidecars on the OS/architecture that will run them.
# The default package contains an editable config template; enterprise-specific
# URLs/JWKS should be injected by the client release job or built locally with
# --config, never committed to this repository.

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: "GitHub Environment containing AITEAM_AGENT_PACKAGE_CONFIG (use agent-package for the template)"
        required: false
        default: agent-package
        type: string
      package_version:
        description: "Optional artifact version; defaults to server/agent_service/package.json"
        required: false
        type: string
      include_darwin_x64:
        description: "Also queue the Intel macOS runner (it may have long hosted-runner wait times)"
        required: false
        default: false
        type: boolean
  push:
    tags: ["agent-v*"]

concurrency:
  group: agent-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_darwin_x64 && '["darwin-arm64","darwin-x64","win32-x64"]' || '["darwin-arm64","win32-x64"]') }}
    runs-on: ${{ matrix.target == 'darwin-arm64' && 'macos-14' || matrix.target == 'darwin-x64' && 'macos-13' || 'windows-2022' }}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || 'agent-package' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Prepare optional enterprise Agent config
        shell: bash
        env:
          AITEAM_AGENT_PACKAGE_CONFIG: ${{ secrets.AITEAM_AGENT_PACKAGE_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -n "${AITEAM_AGENT_PACKAGE_CONFIG:-}" ]]; then
            umask 077
            config_file="$RUNNER_TEMP/aiteam-agent.env"
            printf '%s\n' "$AITEAM_AGENT_PACKAGE_CONFIG" > "$config_file"
            echo "AITEAM_AGENT_CONFIG_FILE=$config_file" >> "$GITHUB_ENV"
            echo "AITEAM_AGENT_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "AITEAM_AGENT_CONFIG_FILE=" >> "$GITHUB_ENV"
            echo "AITEAM_AGENT_CONFIGURED=false" >> "$GITHUB_ENV"
          fi
      - name: Build Agent sidecar
        shell: bash
        env:
          AGENT_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          trap 'rm -f "${AITEAM_AGENT_CONFIG_FILE:-}"' EXIT
          args=(scripts/build-agent-package.mjs --target "${{ matrix.target }}")
          if [[ -n "${AGENT_PACKAGE_VERSION:-}" ]]; then args+=(--version "$AGENT_PACKAGE_VERSION"); fi
          if [[ -n "${AITEAM_AGENT_CONFIG_FILE:-}" ]]; then
            node "${args[@]}" --config "$AITEAM_AGENT_CONFIG_FILE"
          else
            node "${args[@]}"
          fi
          rm -f "${AITEAM_AGENT_CONFIG_FILE:-}"
      - name: Upload Agent package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: aiteam-agent-${{ matrix.target }}
          path: |
            dist/agent-packages/*.tar.gz
            dist/agent-packages/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: 输出客户端集成说明
        shell: bash
        env:
          AGENT_TARGET: ${{ matrix.target }}
          AGENT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || 'agent-package' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ "${AGENT_TARGET}" == win32-* ]]; then
            native_command='AGENT_DIR\runtime\node.exe --import AGENT_DIR\node_modules\tsx\dist\esm\index.mjs AGENT_DIR\bin\start-agent.mjs --config CONFIG_FILE --port 0 --data-dir DATA_DIR'
          else
            native_command='AGENT_DIR/runtime/node --import AGENT_DIR/node_modules/tsx/dist/esm/index.mjs AGENT_DIR/bin/start-agent.mjs --config CONFIG_FILE --port 0 --data-dir DATA_DIR'
          fi
          archive_path="$(find dist/agent-packages -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | sort | head -1)"
          [[ -n "${archive_path}" ]] || { echo "未找到 Agent 压缩包" >&2; exit 1; }
          archive_hint="$(basename "${archive_path}")"
          archive_id_url="${RUN_URL}/artifacts/${ARTIFACT_ID}"
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"
          ## Agent 客户端快速集成 · ${AGENT_TARGET}

          - 下载：${archive_id_url}
          - 内层包：${archive_hint}
          - 企业配置：${AGENT_ENVIRONMENT}（已配置：${AITEAM_AGENT_CONFIGURED:-false}）

          1. 解压 Artifact 外层 ZIP，再解压内层包；将整个 Agent 目录放入客户端资源目录，记为 AGENT_DIR。
          2. 安装/升级时复制 AGENT_DIR/config/agent.env 到客户端配置目录，记为 CONFIG_FILE。
          3. 创建并永久保留用户数据目录 DATA_DIR；升级时不得删除。
          4. 客户端打开后用原生进程 API 启动：

                 ${native_command}

          5. 轮询 DATA_DIR/agent-port.json，取出 pid 和 port；随后检查：

                 GET http://127.0.0.1:PORT_VALUE/healthz  → HTTP 200
                 GET http://127.0.0.1:PORT_VALUE/readyz   → HTTP 200 且 data.ready=true

          6. 原生层将 http://127.0.0.1:PORT_VALUE 注入 WebView，作为 Agent API base URL；禁止写死端口。
          7. 页面只调用 /api/agent/* 和 /api/auth/*；登录后执行 whoami → grants/sync → grants/readiness。
          8. 客户端退出时终止 Agent 子进程；升级只替换 AGENT_DIR，保留 CONFIG_FILE 和 DATA_DIR。

          完整参数和目录示例见包内 CLIENT-INTEGRATION.md。taiyi 包仅用于测试。
          EOF
