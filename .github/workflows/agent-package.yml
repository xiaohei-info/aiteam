name: agent-package

# Build portable Agent sidecars on the OS/architecture that will run them.
# The default package contains an editable config template; enterprise-specific
# URLs/JWKS should be injected by the client release job or built locally with
# --config, never committed to this repository.

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: "GitHub Environment containing AITEAM_AGENT_PACKAGE_CONFIG (use agent-package for the template)"
        required: false
        default: agent-package
        type: string
      package_version:
        description: "Optional artifact version; defaults to server/agent_service/package.json"
        required: false
        type: string
      include_darwin_x64:
        description: "Also queue the Intel macOS runner (it may have long hosted-runner wait times)"
        required: false
        default: false
        type: boolean
  push:
    tags: ["agent-v*"]

concurrency:
  group: agent-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_darwin_x64 && '["darwin-arm64","darwin-x64","win32-x64"]' || '["darwin-arm64","win32-x64"]') }}
    runs-on: ${{ matrix.target == 'darwin-arm64' && 'macos-14' || matrix.target == 'darwin-x64' && 'macos-13' || 'windows-2022' }}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || 'agent-package' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Prepare optional enterprise Agent config
        shell: bash
        env:
          AITEAM_AGENT_PACKAGE_CONFIG: ${{ secrets.AITEAM_AGENT_PACKAGE_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -n "${AITEAM_AGENT_PACKAGE_CONFIG:-}" ]]; then
            umask 077
            config_file="$RUNNER_TEMP/aiteam-agent.env"
            printf '%s\n' "$AITEAM_AGENT_PACKAGE_CONFIG" > "$config_file"
            echo "AITEAM_AGENT_CONFIG_FILE=$config_file" >> "$GITHUB_ENV"
          else
            echo "AITEAM_AGENT_CONFIG_FILE=" >> "$GITHUB_ENV"
          fi
      - name: Build Agent sidecar
        shell: bash
        env:
          AGENT_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          trap 'rm -f "${AITEAM_AGENT_CONFIG_FILE:-}"' EXIT
          args=(scripts/build-agent-package.mjs --target "${{ matrix.target }}")
          if [[ -n "${AGENT_PACKAGE_VERSION:-}" ]]; then args+=(--version "$AGENT_PACKAGE_VERSION"); fi
          if [[ -n "${AITEAM_AGENT_CONFIG_FILE:-}" ]]; then
            node "${args[@]}" --config "$AITEAM_AGENT_CONFIG_FILE"
          else
            node "${args[@]}"
          fi
          rm -f "${AITEAM_AGENT_CONFIG_FILE:-}"
      - name: Upload Agent package
        uses: actions/upload-artifact@v4
        with:
          name: aiteam-agent-${{ matrix.target }}
          path: |
            dist/agent-packages/*.tar.gz
            dist/agent-packages/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Show client integration instructions
        shell: bash
        env:
          AGENT_TARGET: ${{ matrix.target }}
          AGENT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || 'agent-package' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${AGENT_TARGET}" == win32-* ]]; then
            start_command='bin\\start-agent.cmd --config config\\agent.env --port 0 --data-dir "%LOCALAPPDATA%\\AI Team\\agent"'
            archive_hint='aiteam-agent-*-win32-*.zip'
          else
            start_command='bin/start-agent.sh --config config/agent.env --port 0 --data-dir "$HOME/Library/Application Support/AI Team/agent"'
            archive_hint='aiteam-agent-*-darwin-*.tar.gz'
          fi
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"
          ## Agent sidecar · ${AGENT_TARGET}

          - Artifact: **aiteam-agent-${AGENT_TARGET}**
          - Configuration source: GitHub Environment ${AGENT_ENVIRONMENT}
          - Download run: ${RUN_URL}
          - Inner package: ${archive_hint}

          After extracting the Actions artifact, keep the package directory read-only and start the sidecar:

              ${start_command}

          Read agent-port.json from the data directory (or parse AI_TEAM_AGENT_READY) and set the client API base URL to http://127.0.0.1:<port>. Poll /healthz; use /readyz before enabling local execution. The page calls only /api/agent/* and /api/auth/*.

          Stop the child process on client exit; preserve the data directory during upgrades. See the packaged README.md for CORS, config, signing and platform notes.
          EOF
