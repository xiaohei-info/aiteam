name: v1-server-ci

# v1 三端微服务的 CI 质量闸门（防跑偏的客观防线）。
# 当前覆盖：
#   1) 共享契约校验 + 边界约束扫描（旧路径/HERMES_WEBUI_*/旧角色/import app）——无需 PG。
#   2) 集成测试（真 PostgreSQL + RLS）——堵住「集成测试在无 PG 机器上被 deselect、门是绿的
#      但集成路径从没真跑过」的假绿漏洞（该漏洞曾让 M3/M5 的 jsonb→text[] 等真 bug 漏到合并后）。
# Node Agent 的 typecheck/test 由 node-agent job 独立执行；Python jobs 仅覆盖控制面与 shared。
#
# 注：仅作用于 v1 新代码 server/；不触碰冻结的 app/（旧单体有自己的测试）。

on:
  push:
    # 只在集成分支跑 push：worker/PR 分支由 pull_request 事件覆盖，
    # 否则同一提交 push+PR 双跑、每个短命分支也全量跑（曾致 ~250 run/天）。
    branches: ["main", "feature/**"]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  pull_request:
    # main = 终态总控边界；feature/** = v1 开发期的集成分支（PR 多打到这里）。
    # 两者都触发，覆盖棘轮才能在开发期就守住集成分支、不必等大合并。
    branches: ["main", "feature/**"]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"

# 同一 PR/分支的旧 run 直接作废——过期提交的结果没有信息量，只烧分钟数。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 运营端系统管理员凭据：build_system_account_repository() 启动时强制读取
# OPERATION_SYSTEM_USERNAME/OPERATION_SYSTEM_PASSWORD（无默认值，缺则 ValueError）。
# 凡构建运营端 app（get_app("operation")）的用例——契约/集成/棘轮三个 job 都会触到——
# 缺这两个 env 就在 setup 阶段全 ERROR、CI 全红（#235）。值必须为 sysadmin/changeme-me：
# tests/operation/test_system_auth.py 与入户链 e2e 硬编码用这对凭据登录断言。
# 签名密钥（OPERATION_SIGNING_*）可选（缺省启动临时生成）；SERVICE_TOKEN 由各测试自带，无需全局注入。
env:
  OPERATION_SYSTEM_USERNAME: sysadmin
  OPERATION_SYSTEM_PASSWORD: changeme-me

jobs:
  contracts-and-boundary:
    name: 契约校验 + 边界约束
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run contract + boundary tests
        working-directory: server
        # 本 job 不跑 integration（无 PG）；集成测试由下方 integration job 在真 PG 上跑。
        run: python -m pytest -q -m "not integration"

  integration:
    name: 集成测试（真 PostgreSQL + RLS）
    runs-on: ubuntu-latest
    # 真 PG service：库名须为 manager_control_db（0001 迁移硬编码
    # `GRANT CONNECT ON DATABASE manager_control_db`，库不存在该 GRANT 会失败）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manager_control_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manager_control_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # 两类连接分离（#60）：管理连接（postgres 超管，跑迁移/建角色/DDL）+ 业务连接（app_rw，受 RLS）。
    # app_rw 的 LOGIN 口令由 apply_migrations 用 APP_RW_PASSWORD 幂等下发（不入迁移脚本）。
    # env 命名统一为 DB_URL/ADMIN_DB_URL（对齐 shared/config.py + deploy/，#103）。
    env:
      ADMIN_DB_URL: postgresql://postgres:postgres@localhost:5432/manager_control_db
      DB_URL: postgresql://app_rw:apprwpass@localhost:5432/manager_control_db
      APP_RW_PASSWORD: apprwpass
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run integration tests (真 PG + RLS)
        working-directory: server
        # 显式 -m integration；迁移在首次连接自动应用（apply_migrations），无需手动建表。
        run: python -m pytest -q -m integration

  node-agent:
    name: Node Agent typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: server/agent_service/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install Agent dependencies
        working-directory: server/agent_service
        run: pnpm install --frozen-lockfile
      - name: Check Agent
        working-directory: server/agent_service
        run: pnpm check
      - name: Sandbox dry-run contract
        run: bash scripts/check-agent-sandbox.sh --dry-run
      - name: Test Agent
        working-directory: server/agent_service
        run: pnpm test

  branch-coverage-ratchet:
    name: 分支覆盖棘轮（PR→main 不退化）
    runs-on: ubuntu-latest
    # 总控门：仅在 PR 时跑（PR→main 与 PR→feature/** 均触发，push 不跑）。
    # 口径=整仓总分支覆盖「不退化」：PR head 不得低于 base(main)。
    # main 自身即基线，永远最新、自动随提升上调、能 block 聚合回退——无需维护基线文件。
    # 注：per-卡 diff 覆盖硬门槛由 worker/reviewer 本地 diff-cover 把守；CI 侧改动分支
    # 覆盖门（F1, diff-cover --fail-under=90）待 baseline 抬到≥90% 后点亮。
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manager_control_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manager_control_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DB_URL: postgresql://postgres:postgres@localhost:5432/manager_control_db
      DB_URL: postgresql://app_rw:apprwpass@localhost:5432/manager_control_db
      APP_RW_PASSWORD: apprwpass
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      - name: Checkout base (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: head/server/requirements.txt

      - name: 覆盖率 - PR head（全量套件 + 分支）
        working-directory: head/server
        # 跑全量套件（含 integration，PG 已就绪）以反映真实总覆盖；
        # 测试是否全绿由上面的 contracts/integration job 把关，此处只取覆盖数字。
        # continue-on-error：用例失败不应让棘轮红（那是 contracts/integration 的职责）；
        # pytest-cov 在会话结束仍写出 json，比对步骤据此取数。否则「修失败用例的 PR」会
        # 因 base 分支仍带旧失败用例 → base 步 pytest 非零退出 → 棘轮假阴性（对齐 web-ci.yml）。
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov diff-cover
          python -m pytest -q \
            --cov=operation_service --cov=manager_service --cov=shared \
            --cov-branch --cov-report=json:"$RUNNER_TEMP/head.json" --cov-report=xml:coverage.xml

      # base(main) 的覆盖数字对同一 base sha 恒定——按 sha 缓存，命中即跳过
      # base 全量跑（棘轮 job 原本每个 PR 要跑两遍全量套件，这里砍掉恒定的那一半）。
      - name: 缓存 base 覆盖率（按 base sha）
        id: base-cov
        uses: actions/cache@v4
        with:
          path: base-cov/base.json
          key: server-base-cov-${{ github.event.pull_request.base.sha }}

      - name: 覆盖率 - base main（全量套件 + 分支，仅缓存未命中时）
        if: steps.base-cov.outputs.cache-hit != 'true'
        working-directory: base/server
        # 同上：base 只取覆盖数字，base 套件是否全绿不影响棘轮（对齐 web-ci.yml base 步）。
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/base-cov"
          pip install -r requirements.txt pytest pytest-cov
          python -m pytest -q \
            --cov=operation_service --cov=manager_service --cov=shared \
            --cov-branch --cov-report=json:"$GITHUB_WORKSPACE/base-cov/base.json"

      - name: 改动分支覆盖门槛（diff-cover ≥90%）
        # F1: skill 要求的 CI 物理层 diff-cover 门——改动行分支覆盖 <90% → CI 红灯。
        # baseline 已抬到整仓 94%（#234 补齐后），门可安全点亮。
        # 该步不含 continue-on-error：diff-cover 是硬门槛，低于阈值必须 block PR。
        # 棘轮（总覆盖不退化）仍在下方保留为额外兜底。
        working-directory: head
        run: |
          diff-cover server/coverage.xml \
            --compare-branch=${{ github.event.pull_request.base.sha }} \
            --fail-under=90

      - name: 棘轮比对（head ≥ base 否则红灯）
        run: |
          python - <<'PY'
          import json, os
          t = os.environ["RUNNER_TEMP"]
          w = os.environ["GITHUB_WORKSPACE"]
          head = json.load(open(f"{t}/head.json"))["totals"]["percent_covered"]
          base = json.load(open(f"{w}/base-cov/base.json"))["totals"]["percent_covered"]
          print(f"base(main) 分支覆盖: {base:.2f}%")
          print(f"head(PR)     分支覆盖: {head:.2f}%")
          # 0.01% 容差吸收行计数抖动
          if head + 0.01 < base:
              print(f"::error::分支覆盖回退 {base:.2f}% → {head:.2f}%——PR 不得降低 main 总覆盖（补测试或提升覆盖后再合）")
              raise SystemExit(1)
          print("OK：总分支覆盖未退化")
          PY

