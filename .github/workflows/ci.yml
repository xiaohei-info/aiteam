name: v1-server-ci

# v1 三端微服务的 CI 质量闸门（防跑偏的客观防线）。
# 当前覆盖：共享契约校验 + 边界约束扫描（旧路径/HERMES_WEBUI_*/旧角色/import app）。
# 待服务建成后逐步打开：OpenAPI 质量门禁、RLS 跨租户、timeline parity、隐私 e2e、分端产物隔离
# （见 server/tests/integration/test_verification_matrix.py 占位）。
#
# 注：仅作用于 v1 新代码 server/；不触碰冻结的 app/（旧单体有自己的测试）。

on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"

jobs:
  contracts-and-boundary:
    name: 契约校验 + 边界约束
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run contract + boundary tests
        working-directory: server
        # 不跑 integration 占位（其依赖未建成，标了 skip）；契约与边界测试必须全绿。
        run: python -m pytest -q -m "not integration"

