# G1 — PR-quick gate.
# Fast (5-10 min) release-blocking subset of the integration surface: Loop A/B/C
# + API/security negative matrix (see server/PR_QUICK_MANIFEST.md). Runs the
# `integration and pr_quick` marker slice against real PostgreSQL + RLS, so it
# catches obvious breakage on every push/PR without waiting for the full suite.
#
# Complements ci.yml (which runs the FULL `pytest -q -m integration` as G2).
# This workflow only runs the small pr_quick slice — nightly-only big-data /
# multi-browser / 300s rollup are intentionally excluded (non-goal: do not turn
# nightly-only into a PR-quick blocker).
name: pr-quick

on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - ".github/workflows/pr-quick.yml"
  pull_request:
    branches: ["master", "feature/**"]
    paths:
      - "server/**"
      - ".github/workflows/pr-quick.yml"

permissions:
  contents: read

concurrency:
  group: pr-quick-${{ github.ref }}
  cancel-in-progress: true

# Operation app assembly requires these at import time (mirrors ci.yml).
env:
  OPERATION_SYSTEM_USERNAME: sysadmin
  OPERATION_SYSTEM_PASSWORD: changeme-me

jobs:
  pr-quick:
    name: PR-quick（integration + pr_quick 子集，真 PG + RLS）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manager_control_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manager_control_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DB_URL: postgresql://postgres:postgres@localhost:5432/manager_control_db
      DB_URL: postgresql://app_rw:apprwpass@localhost:5432/manager_control_db
      APP_RW_PASSWORD: apprwpass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pytest-timeout

      - name: PR-quick subset
        working-directory: server
        run: python -m pytest -q -m "integration and pr_quick" --timeout=300
