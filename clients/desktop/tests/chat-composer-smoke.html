<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat composer smoke</title></head>
<body><div id="root" style="height:100vh;display:flex;flex-direction:column;justify-content:flex-end"></div><script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import '../src/styles/globals.css'
import '../src/pages/Chat/Chat.css'
import { ChatInputBar } from '../src/components/Chat/ChatInputBar.tsx'
import { dispatchFileDrop } from '../src/lib/nativeFileDrop.ts'

// 单聊/群聊输入框统一后的行为冒烟：?mode=single|group&variant=dock|hero
// window.__setConv(id) 切会话（草稿走 __drafts）；window.__failNext = true 让下一次发送失败。
const params = new URLSearchParams(location.search)
const mode = params.get('mode') ?? 'single'
const variant = params.get('variant') ?? 'dock'
window.__sent = []
window.__drafts = {}
window.__failNext = false
window.__imported = []
window.__importedPaths = []
// 浏览器里没有 Tauri 原生拖放：冒烟直接喂同样形状的事件（position 为 CSS 像素，deviceScaleFactor=1）。
window.__fileDrop = dispatchFileDrop

const members = mode === 'group'
  ? [
      { employee_id: 'employee-1', display_name: '数据分析师', handle: 'analyst', can_mention: true },
      { employee_id: 'employee-2', display_name: '产品经理', handle: 'pm', can_mention: true },
    ]
  : undefined
const employees = mode === 'single' ? [{ employeeId: 'employee-1', displayName: '数据分析师' }] : []

function Harness() {
  const [convId, setConvId] = React.useState('conversation-1')
  window.__setConv = setConvId
  return React.createElement(ChatInputBar, {
    convId,
    draft: window.__drafts[convId]?.text ?? '',
    draftMentions: window.__drafts[convId]?.mentionSnapshot,
    members,
    employees,
    variant,
    placeholder: variant === 'hero' ? '描述你要完成的任务…' : '输入消息…',
    onSend: async (text, files, employeeId, mentions) => {
      if (window.__failNext) { window.__failNext = false; return false }
      window.__sent.push({ text, employeeId: employeeId ?? null, mentions: mentions ?? [] })
      return true
    },
    onPickFile: async () => null,
    // 浏览器里没有 Tauri invoke：假装缓存成功，记录下来供断言。
    onImportFile: async (file) => {
      window.__imported.push({ name: file.name, size: file.size, mime: file.type })
      return {
        rel_path: `u/${convId}/file/${file.name}`,
        asset_url: URL.createObjectURL(file),
        name: file.name,
        size: file.size,
        mime: file.type,
      }
    },
    onImportPath: async (path) => {
      window.__importedPaths.push(path)
      const name = path.split('/').pop()
      return { rel_path: `u/${convId}/file/${name}`, asset_url: '', name, size: 1, mime: 'application/octet-stream' }
    },
    onDraftChange: (id, text, files, mentionSnapshot) => { window.__drafts[id] = { text, mentionSnapshot } },
  })
}
createRoot(document.getElementById('root')).render(React.createElement(Harness))
window.__ready = true
</script></body></html>
