<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat paste smoke</title></head>
<body><div id="root" style="height:100vh"></div><script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import '../src/styles/globals.css'
import { ChatInputBar } from '../src/components/Chat/ChatInputBar.tsx'

// 复现「粘贴内容后发送按钮不可用」：单聊（不传成员）与群聊（有成员）都渲染 MentionInput。
const params = new URLSearchParams(location.search)
const mode = params.get('mode') ?? 'single'
window.__sent = []
window.__drafts = []

const members = mode === 'group'
  ? [{ employee_id: 'employee-1', display_name: '数据分析师', handle: 'analyst', can_mention: true }]
  : undefined

const bar = React.createElement(ChatInputBar, {
  convId: 'conversation-1',
  draft: '',
  members,
  employees: mode === 'single' ? [{ employee_id: 'employee-1', display_name: '数据分析师' }] : [],
  variant: 'dock',
  onSend: async (text) => { window.__sent.push(text); return true },
  onPickFile: async () => null,
  onDraftChange: (convId, text) => { window.__drafts.push(text) },
})
createRoot(document.getElementById('root')).render(bar)
window.__ready = true
</script></body></html>
